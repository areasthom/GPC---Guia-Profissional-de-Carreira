<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="login.css">
    <link rel="shortcut icon" href="midia/GPCfavicon.png" type="image/x-icon">
    <title>Login</title>
</head>
<body>
    <section class="conteudo1">
        <div class="hero1">
            <div class="info-texto">
                SUA JORNADA CONTINUA
            </div>
            <h1>
                Todo passo conta.
            </h1>
            <p>
                Retome suas trilhas, conclua desafios e acompanhe a carreira que você está construindo.
            </p>
        </div>
    </section>
    <section class="conteudo2">
        <div class="hero2">
            <form id="formLogin">
                <div class="cabecalho">
                    <a href="index.html" class="btn-voltarInicio">← Voltar ao início</a>
                    <img src="midia/GPClogo.png" alt="logo-gpc">
                </div>
                <div class="area-login">
                    <h2>Que bom ter você de volta.</h2>
                    <p>Entre para continuar sua jornada.</p>
                    <label for="email">E-mail</label>
                    <input id="email" type="email" placeholder="voce@gmail.com" required>
                    
                    <label for="senha">Senha</label>
                    <input id="senha" type="password" placeholder="Digite sua senha" required>
                    
                    <a href="#" class="esqueciSenha">Esqueci minha senha</a>
                    <button class="btn-entrar">Entrar</button>
                    <div class="btn-criarConta">
                        <p>Ainda não tem uma conta? <a href="cadastro.html">Criar conta</a></p>
                    </div>
                </div>
            </form>
        </div>
    </section>
    <script src="js/api.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
