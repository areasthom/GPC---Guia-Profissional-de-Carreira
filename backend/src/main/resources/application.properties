spring.application.name=gpc

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/gpc}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# --- Recuperação de senha ---
# Tempo de validade do link (minutos)
gpc.recuperacao.validade-minutos=30
# Endereço da tela de redefinição (usado no link impresso no console do backend)
gpc.recuperacao.url-base=http://localhost:5500/redefinir-senha.html
# MODO DESENVOLVIMENTO: sem servidor de e-mail, a API devolve o token para a tela
# mostrar o link. NUNCA deixe true em produção (qualquer um redefiniria qualquer conta).
gpc.recuperacao.modo-dev=true
